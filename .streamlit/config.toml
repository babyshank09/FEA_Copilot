[theme]
# Matches the palette in src/frontend/streamlit/style.py.
# Streamlit needs this for widget internals the injected CSS can't reach
# (dropdown menus, dataframe cells, date pickers).
base = "dark"
primaryColor = "#2F6BFF"
backgroundColor = "#04070E"
secondaryBackgroundColor = "#0B1220"
textColor = "#C6D2E8"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
# Uploaded .odb/.inp files are routinely larger than the 200MB default.
maxUploadSize = 1024
